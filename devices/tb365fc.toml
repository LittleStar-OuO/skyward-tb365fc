[device]
codename = "tb365fc"
brand = "Lenovo"
model = "Lenovo Xiaoxin Pad 12.1 (2025)"
ab = true
soc = { hans = "天玑 6400", hant = "天璣 6400", en = "Dimensity 6400" }
os_version_prop = "ro.build.display.id"
# Stock recovery rides in the vendor boot image: the partition table has no
# recovery partition, and the vendor ramdisk carries /init, system/bin/recovery,
# recovery.fstab and res/.
recovery_partition = "vendor_boot"
# The debug policy lets adbd take its own context back and the shell beside
# it; the stock values are replaced by the packer.
adb_root = true
# init starts the key programs (its policy alone lets them run here)
keys_from_init = true
# MediaTek's recovery init never starts the service directory; Skyward starts
# it once, as xaga does.
restart_service_directory = false

[display]
# The 12.1-inch 2560 x 1600 panel, natural portrait; density as the running
# system reports it (wm density 320).
width = 1600
height = 2560
density = 320
diagonal = 12.1
# MediaTek's display driver tears at its high modes; stay at the mode the
# panel comes up in, as xaga does.
fastest_refresh = false

[modules]
# init loads modules.load.recovery from the vendor_boot ramdisk before it
# starts the recovery service: the Himax touchscreen driver (hxchipset), the
# panel and the vibration motor are among them, so nothing extra is loaded
# here.
sources = ["vendor_boot"]
load = []

# The Himax HX83122B touchscreen reports ordinary multitouch, as far as
# dumpsys input shows (himax-touchscreen, TOUCH_MT); nothing is written to it.

[partitions]
# The phone mounts persist at /mnt/vendor/persist; the sensors' calibration
# is there. metadata holds the key directory /data's files are opened with.
mounted = ["persist", "metadata"]

# The nodes the TEE's programs open, as the phone's own init hands them over
# before its programs start; a recovery runs none of those lines.
[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/teei_client", "/dev/teei_config", "/dev/tz_vfs"]

[[owners]]
user = "system"
group = "drmrpc"
mode = 0o666
paths = ["/dev/isee_tee0"]

# The UFS RPMB unit and its node, through which teei_daemon serves the
# secure world's storage; the gatekeeper applet reads what it keeps there as
# it loads.
[[owners]]
user = "system"
group = "system"
mode = 0o660
paths = ["/dev/0:0:0:49476", "/dev/rpmb0"]

[backup]
# MediaTek keeps the baseband's and the sensors' settings, with the phone's
# own identity, in its own partitions.
efs = ["nvdata", "nvcfg", "protect1", "protect2", "persist"]

[wipe]
logs = ["/data/vendor/mtklog", "/data/vendor/connsyslog"]
